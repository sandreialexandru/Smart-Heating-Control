name: Release

# Creates a GitHub release (and tag) when the version in manifest.json changes,
# only after every test passed (the Tests workflow). Run it manually from the
# Actions tab to (re)check.
#
# Note: a workflow_run uses this file as it is on main; until a change here
# reaches main, run it by hand on the branch (Run workflow, Branch: refactor).
#
# main:     a stable version (e.g. 2.3.30) becomes a normal release (the latest).
# dev:      a beta version (e.g. 2.3.30b1) becomes a pre-release, shown in HACS
#           only to those who turned on the beta versions for this repository.
# refactor: an alpha version (e.g. 2.6.0a1) becomes a pre-release too, for
#           trying bigger changes at home before they go to dev.
# Any other combination (a beta on main, an alpha on dev...) is skipped.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main, dev, refactor]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Never release a version whose tests failed.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read version
        id: version
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/advanced_climate/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          beta=false
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then beta=true; fi
          echo "beta=$beta" >> "$GITHUB_OUTPUT"
          # The kind of version each branch releases.
          allowed=false
          if [[ "$BRANCH" == "main" && "$beta" == "false" ]]; then allowed=true; fi
          if [[ "$BRANCH" == "dev" && "$version" =~ (b|rc)[0-9]+$ ]]; then allowed=true; fi
          if [[ "$BRANCH" == "refactor" && "$version" =~ a[0-9]+$ ]]; then allowed=true; fi
          if [[ "$allowed" == "false" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $version on $BRANCH: main releases stable versions, dev beta versions (b, rc) and refactor alpha versions (a)."
          elif git rev-parse "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.version.outputs.exists == 'false'
        with:
          python-version: "3.13"

      - name: Test the logic before releasing
        if: steps.version.outputs.exists == 'false'
        run: python -m unittest discover -s tests -t .

      - name: Build the zip
        if: steps.version.outputs.exists == 'false'
        run: |
          cd custom_components/advanced_climate
          zip -r "$GITHUB_WORKSPACE/advanced_climate.zip" . -x "*/__pycache__/*"

      - name: Release notes from the changelog
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          # An alpha or beta takes the "Unreleased" section of CHANGELOG.md, a release its
          # own "## <version>" section; without one GitHub writes the notes.
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8") if path.exists() else ""
          head = "Unreleased" if os.environ["BETA"] == "true" else os.environ["VERSION"]
          notes = ""
          for part in re.split(r"(?m)^## ", text)[1:]:
              title, _, body = part.partition("\n")
              words = title.split()
              if words and words[0] == head:
                  notes = body.strip()
                  break
          if notes:
              pathlib.Path("notes.md").write_text(notes + "\n", encoding="utf-8")
          print(notes or "No changelog section: GitHub writes the notes.")
          PY

      - name: Create the release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          if [[ "$BETA" == "true" ]]; then kind=(--prerelease --latest=false); else kind=(--latest); fi
          if [[ -f notes.md ]]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$TAG" advanced_climate.zip \
            --target "$SHA" \
            --title "Smart Heating Control $TAG" \
            "${notes[@]}" \
            "${kind[@]}"

      # HACS reads only the first releases GitHub lists, and GitHub sorts the
      # pre-release names as text (a10 between a1 and a2), so a new alpha could
      # be missing in HACS. Of the earlier alphas of the same version only the
      # last 3 keep their release page, to go back to; the older pages are
      # removed (their tags and the code stay).
      # Also when the release exists already (run by hand on refactor to tidy up).
      - name: Keep the last 3 earlier alphas of this version
        if: contains(steps.version.outputs.version, 'a')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          KEEP: 3
        run: |
          [[ "$BRANCH" == "refactor" ]] || exit 0
          gh release view "$TAG" >/dev/null 2>&1 || { echo "$TAG has no release yet."; exit 0; }
          base="${TAG%a*}"
          current="${TAG##*a}"
          gh release list --limit 200 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' |
            while read -r old; do
              if [[ "$old" =~ ^${base//./\\.}a([0-9]+)$ ]] && (( BASH_REMATCH[1] < current )); then
                echo "${BASH_REMATCH[1]} $old"
              fi
            done | sort -rn | tail -n +$((KEEP + 1)) | while read -r _ old; do
              echo "Removing the release page of $old (the tag stays)"
              gh release delete "$old" --yes
            done
