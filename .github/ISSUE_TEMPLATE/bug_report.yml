name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Smart Heating Control version
      description: HACS → Smart Heating Control, or Settings → Devices & services → Smart Heating Control.
      placeholder: "2.3.19"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Settings → About.
      placeholder: "2026.10.2"
    validations:
      required: true
  - type: dropdown
    id: heating
    attributes:
      label: How the room is heated
      multiple: true
      options:
        - Generic Thermostat
        - Other thermostat / TRV (temperature)
        - Other thermostat / TRV (preset)
        - Other thermostat (on / off with hvac_mode)
        - Relay / switch
        - Heat source (boiler) started by the integration
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: What you saw, when (date and time), in which room. The text of the room *Decision* helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → Smart Heating Control → ⋮ → Download diagnostics, then drag the file here.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Lines with `advanced_climate` from Settings → System → Logs.
      render: text
