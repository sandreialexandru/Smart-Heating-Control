name: Mutation testing

# Do the tests notice a small mistake in the code? Every mutant is one small
# change; the report lists the ones no test notices. The Python modules with
# tests/mutation/mutate.py (the logic, the rooms, the house, the forms), the
# card with Stryker (tests/mutation/stryker.card.json, the tests of tests/card).
#
# - Every week, in the night from Saturday to Sunday (00:23 in Bucharest in
#   winter, 01:23 in summer: cron is in UTC), on the code of dev. A schedule
#   runs from the copy of this file on main, so it starts once it is on main.
# - By hand: Actions → Mutation testing → Run workflow (on the branch chosen
#   there), optionally only some modules or fewer mutants.
# - A short try (a few mutants of each) when the mutation tools change on dev.
#
# The report is in the summary of the run and in the artifact mutation-report.

on:
  schedule:
    - cron: "23 22 * * 6"
  workflow_dispatch:
    inputs:
      files:
        description: "Modules to mutate, separated by spaces, e.g. engine.py learning.py (empty: all)"
        default: ""
      shards:
        description: "Jobs in parallel (1 to 20)"
        default: "20"
      limit:
        description: "At most this many mutants per job (0: all)"
        default: "0"
      python:
        description: "The Python modules"
        type: boolean
        default: true
      card:
        description: "The card (Stryker)"
        type: boolean
        default: true
  push:
    branches: [dev]
    paths:
      - tests/mutation/**
      - tests/card/run.js
      - .github/workflows/mutation.yml

concurrency:
  group: mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      limit: ${{ steps.plan.outputs.limit }}
      files: ${{ steps.plan.outputs.files }}
      ref: ${{ steps.plan.outputs.ref }}
      python: ${{ steps.plan.outputs.python }}
      card: ${{ steps.plan.outputs.card }}
      card_matrix: ${{ steps.plan.outputs.card_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          FILES: ${{ inputs.files }}
          SHARDS: ${{ inputs.shards }}
          LIMIT: ${{ inputs.limit }}
          REF: ${{ github.ref_name }}
          PYTHON: ${{ inputs.python }}
          CARD: ${{ inputs.card }}
        run: |
          card_shards=10
          python=true
          card=true
          case "$EVENT" in
            schedule) shards=20; limit=0; files=""; ref=dev ;;
            push) shards=2; limit=3; files=""; ref="$REF"; card_shards=1 ;;
            *) shards="${SHARDS:-20}"; limit="${LIMIT:-0}"; files="$FILES"; ref="$REF"
               python="${PYTHON:-true}"; card="${CARD:-true}" ;;
          esac
          # The card in equal parts of its lines (Stryker mutates the lines of a range);
          # the short try only a few lines.
          card_file=custom_components/advanced_climate/www/smart-heating-control-card.js
          card_matrix=$(EVENT="$EVENT" N="$card_shards" FILE="$card_file" python3 -c "
          import json, os
          lines = sum(1 for _ in open(os.environ['FILE'], encoding='utf-8'))
          n = int(os.environ['N'])
          if os.environ['EVENT'] == 'push':
              parts = [{'part': 0, 'range': '1200-1215'}]
          else:
              size = -(-lines // n)
              parts = [{'part': i, 'range': f'{i * size + 1}-{min(lines, (i + 1) * size)}'} for i in range(n)]
          print(json.dumps(parts))")
          if ! [[ "$shards" =~ ^[0-9]+$ ]] || (( shards < 1 || shards > 20 )); then shards=20; fi
          if ! [[ "$limit" =~ ^[0-9]+$ ]]; then limit=0; fi
          matrix=$(python3 -c "import json; print(json.dumps(list(range($shards))))")
          {
            echo "matrix=$matrix"
            echo "shards=$shards"
            echo "limit=$limit"
            echo "files=$files"
            echo "ref=$ref"
            echo "python=$python"
            echo "card=$card"
            echo "card_matrix=$card_matrix"
          } >> "$GITHUB_OUTPUT"
          echo "Mutation testing of ${files:-every module} on $ref: $shards jobs, limit $limit per job (0 = all)."

  mutate:
    name: Mutants ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: python -c "import pytest_cov" || pip install pytest-cov
      - name: Mutants
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          LIMIT: ${{ needs.plan.outputs.limit }}
          FILES: ${{ needs.plan.outputs.files }}
        run: |
          mkdir -p results
          args=(--shard "$SHARD" --shards "$SHARDS" --limit "$LIMIT" --max-minutes 320
                --out "results/shard-$SHARD.json")
          if [ -n "$FILES" ]; then
            read -ra modules <<< "$FILES"
            args+=(--files "${modules[@]}")
          fi
          python tests/mutation/mutate.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: results/shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7

  card:
    name: Card mutants ${{ matrix.part.part }} (lines ${{ matrix.part.range }})
    needs: plan
    if: needs.plan.outputs.card == 'true'
    # Playwright 1.56 has its Chromium for Ubuntu 24.04, not yet for the newest runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.card_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # In the root, so the copies Stryker tests in find them too.
      - run: npm install --no-save --no-audit --no-fund @stryker-mutator/core@8.7.1 playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - name: Mutants of the card
        env:
          CARD_TEST_FAIL_FAST: "1"
          RANGE: ${{ matrix.part.range }}
        run: >-
          npx stryker run tests/mutation/stryker.card.json
          --mutate "custom_components/advanced_climate/www/smart-heating-control-card.js:$RANGE"
      - name: Results
        if: always()
        run: |
          mkdir -p results
          if [ -f reports/card-mutation.json ]; then
            python3 tests/mutation/stryker_results.py reports/card-mutation.json \
              --out "results/card-${{ matrix.part.part }}.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-shard-card-${{ matrix.part.part }}
          path: results/card-${{ matrix.part.part }}.json
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report
    needs: [plan, mutate, card]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-*
          path: results
          merge-multiple: true
      - name: Report
        run: |
          python3 tests/mutation/report.py results/*.json --markdown mutation-report.md --json mutation-all.json
          cat mutation-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            mutation-report.md
            mutation-all.json
          retention-days: 90
