[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.coverage.run]
source = ["custom_components/advanced_climate"]

[tool.coverage.report]
skip_empty = true
