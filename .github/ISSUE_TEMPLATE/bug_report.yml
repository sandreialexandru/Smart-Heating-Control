name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: checkboxes
    id: guide
    attributes:
      label: Before you report
      options:
        - label: I have read the [guide](https://github.com/sandreialexandru/Smart-Heating-Control/blob/main/docs/guide/README.md) and this is not how it is meant to work.
          required: true
  - type: input
    id: version
    attributes:
      label: Smart Heating Control version
      description: Settings → Marketplace (or HACS) → Smart Heating Control, or Settings → Devices & services → Smart Heating Control.
      placeholder: "2.3.19"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Settings → About.
      placeholder: "2026.10.2"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where is the problem
      options:
        - The heating (a decision, a device, the heat source)
        - The card
        - The panel (SHC in the sidebar)
        - Setting up (adding the house or a room, the options)
    validations:
      required: true
  - type: dropdown
    id: heating
    attributes:
      label: How the room is heated
      multiple: true
      options:
        - Generic Thermostat
        - Other thermostat / TRV (temperature)
        - Other thermostat / TRV (preset)
        - Other thermostat (on / off with hvac_mode)
        - Relay / switch
        - Heat source (boiler) started by the integration
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: What you saw, when (date and time), in which room. The text of the room *Decision* helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Settings → Devices & services → Smart Heating Control → ⋮ → Download
        diagnostics, then drag the file here. It has the settings and the last
        100 decisions of every room, with their reasons.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: >-
        1. Settings → Devices & services → Smart Heating Control → ⋮ → Enable
        debug logging. 2. Make the problem happen again (or wait until it
        does). 3. ⋮ → Disable debug logging: Home Assistant downloads the log
        file; drag it here. For a problem only in the card or the panel, paste
        here the errors of the browser console instead (F12 → Console) and add
        a screenshot.
    validations:
      required: true
