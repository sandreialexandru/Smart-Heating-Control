<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Smart Heating Configurator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered wizard column; a thermometer-style progress strip runs cool to warm across the top. */
:root {
  --bg: #edf1f2;
  --surface: #ffffff;
  --ink: #14262e;
  --muted: #56707a;
  --line: #d2dde1;
  --accent: #0b6b8a;
  --accent-ink: #ffffff;
  --accent-soft: #dcedf3;
  --heat: #b8601a;
  --heat-soft: #fbebd8;
  --good: #1d7a4e;
  --warn: #9a6200;
  --warn-soft: #fbf0d4;
  --err: #b3362c;
  --err-soft: #fbe3e0;
  --info-soft: #e3edf1;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d191e; --surface: #14242b; --ink: #e2edf0; --muted: #8ea7b0; --line: #29404a;
    --accent: #4db4d4; --accent-ink: #06222c; --accent-soft: #12394a;
    --heat: #f0a257; --heat-soft: #3a2a17; --good: #5fcf98; --warn: #e8b84f; --warn-soft: #382d12;
    --err: #ff8f84; --err-soft: #3f1d1a; --info-soft: #172f39;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d191e; --surface: #14242b; --ink: #e2edf0; --muted: #8ea7b0; --line: #29404a;
  --accent: #4db4d4; --accent-ink: #06222c; --accent-soft: #12394a;
  --heat: #f0a257; --heat-soft: #3a2a17; --good: #5fcf98; --warn: #e8b84f; --warn-soft: #382d12;
  --err: #ff8f84; --err-soft: #3f1d1a; --info-soft: #172f39;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 24px;
}
#app { max-width: 780px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 1.05rem; }
.mark { width: 14px; height: 30px; border-radius: 7px; background: linear-gradient(to top, var(--heat) 0 40%, var(--accent) 40% 100%); box-shadow: inset 0 0 0 2px var(--surface); outline: 2px solid var(--line); flex: none; }
.mark.big { width: 24px; height: 52px; border-radius: 12px; }
.tools { display: flex; gap: 8px; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 0.9rem; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }

.prog { display: flex; gap: 6px; margin: 4px 0 18px; }
.seg { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.seg .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.seg .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--heat)); border-radius: 4px; transition: width 0.25s; }
.seg span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg.now span { color: var(--ink); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 0.78rem; border-radius: 999px; padding: 3px 10px; background: var(--accent-soft); color: var(--accent); font-weight: 500; max-width: 100%; overflow-wrap: anywhere; }
.chip.room { background: var(--heat-soft); color: var(--heat); }
.chip.where { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.card h1 { font-size: clamp(1.5rem, 4.4vw, 2.1rem); }
.intro { color: var(--muted); max-width: 66ch; }

.fld { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.fh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fh h3 { font-size: 1.12rem; }
.tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.tag.req { color: var(--err); border-color: var(--err); }
.tag.helper { color: var(--heat); border-color: var(--heat); }
.fd { color: var(--ink); max-width: 68ch; }
.fnote, .hint { font-size: 0.88rem; color: var(--muted); max-width: 68ch; }
.fex, .live { font-size: 0.92rem; background: var(--heat-soft); border-radius: 8px; padding: 8px 12px; max-width: 68ch; }
.fex b, .xr b { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--heat); margin-bottom: 2px; }
.live { background: var(--info-soft); color: var(--ink); font-variant-numeric: tabular-nums; }
.lockmsg { background: var(--warn-soft); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 0.92rem; }
.errmsg { background: var(--err-soft); color: var(--ink); border-left: 4px solid var(--err); border-radius: 8px; padding: 10px 12px; font-size: 0.92rem; }
.fld.locked .fh h3, .fld.locked .fd { opacity: 0.7; }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; background: var(--surface); min-width: 0; }
.opt:hover { border-color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
.opt.dis { opacity: 0.6; cursor: not-allowed; }
.opt input { margin: 4px 0 0; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.ob { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.ot { font-weight: 600; }
.om { color: var(--muted); font-size: 0.93rem; }
.opt.sel .om { color: var(--ink); }
.olock { color: var(--warn); font-size: 0.88rem; }
.ox { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.xr { background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 0.93rem; }
.xr.ex { background: var(--heat-soft); }

.numrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rng { flex: 1 1 160px; min-width: 120px; max-width: 320px; accent-color: var(--accent); }
.numin, .txt { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.numin { width: 7.5rem; font-variant-numeric: tabular-nums; }
.txt { width: 100%; max-width: 560px; }
textarea.txt { max-width: 100%; resize: vertical; line-height: 1.5; }
.mono { font-family: var(--font-mono); font-size: 0.9rem; }
.unit { color: var(--muted); min-width: 2ch; }
.dflt { font-size: 0.8rem; color: var(--muted); }

.nav { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 16px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.count { color: var(--muted); font-size: 0.88rem; font-variant-numeric: tabular-nums; }
.btns { display: flex; gap: 8px; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 20px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }

.lang { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 56px 0 32px; }
.lang h1 { font-size: clamp(1.8rem, 6vw, 2.8rem); }
.lang p { max-width: 52ch; color: var(--muted); }
.langbtns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
.btn.big { display: flex; flex-direction: column; gap: 2px; padding: 18px 36px; border-radius: 14px; min-width: 200px; }
.btn.big b { font-family: var(--font-display); font-size: 1.4rem; }
.btn.big small { opacity: 0.85; }

.box { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.box h2 { font-size: 1.05rem; }
.box ol, .box ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; }
.box ul { list-style: none; padding: 0; }
.checks li { display: flex; gap: 10px; align-items: flex-start; border-radius: 8px; padding: 8px 10px; }
.checks li .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; flex: none; }
.checks li.err { background: var(--err-soft); } .checks li.err .dot { background: var(--err); }
.checks li.warn { background: var(--warn-soft); } .checks li.warn .dot { background: var(--warn); }
.checks li.info { background: var(--info-soft); } .checks li.info .dot { background: var(--accent); }
.ok { color: var(--good); font-weight: 500; }
.sumtools { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chk { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.chk input { accent-color: var(--accent); width: 18px; height: 18px; }
.path { margin-top: 10px; font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.path span { text-transform: uppercase; letter-spacing: 0.07em; font-size: 0.7rem; color: var(--heat); }
.path b { color: var(--ink); }
.grp { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.grp h3 { font-size: 1.02rem; }
dl { margin: 0; display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 4px 16px; padding: 7px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
dt { color: var(--muted); font-size: 0.92rem; }
dd { margin: 0; overflow-wrap: anywhere; }
.row.chg dd { font-weight: 600; color: var(--accent); }
dd pre { margin: 0; white-space: pre-wrap; font-family: var(--font-mono); font-size: 0.85rem; font-weight: 400; color: var(--ink); }
.none { color: var(--muted); }

@media (max-width: 560px) {
  .card { padding: 18px 16px; border-radius: 14px; }
  .row { grid-template-columns: 1fr; }
  .btn { padding: 10px 16px; }
}
@media (prefers-reduced-motion: reduce) { .seg .bar i { transition: none; } }
</style>
<div id="app"></div>
<noscript>This guide needs JavaScript.</noscript>
<script>
/* ===== content: steps, fields, options (EN / RO) ===== */
const L = (en, ro) => ({ en, ro });
const T = {
  pickLang: L('Choose your language', 'Alege limba'),
  pickLangSub: L('Interactive setup guide for Smart Heating Control for Home Assistant. Every choice explains what it means and how it changes the heating.', 'Ghid interactiv de configurare pentru Smart Heating Control în Home Assistant. Fiecare alegere explică ce înseamnă și cum influențează încălzirea.'),
  title: L('Smart Heating Configurator', 'Configurator Smart Heating'),
  back: L('Back', 'Înapoi'), next: L('Next', 'Mai departe'), finish: L('Show my configuration', 'Arată configurația mea'),
  step: L('Step', 'Pasul'), of: L('of', 'din'),
  secHouse: L('House', 'Casa'), secOpts: L('House options', 'Opțiuni casă'), secRooms: L('Rooms', 'Camere'), secDone: L('Summary', 'Rezumat'),
  means: L('What it means', 'Ce înseamnă'), effect: L('How it changes the heating', 'Cum influențează'), example: L('Example', 'Exemplu'),
  required: L('required', 'obligatoriu'), optional: L('optional', 'opțional'), helperTag: L('question for you', 'întrebare pentru tine'),
  def: L('default', 'implicit'), emptyIs: L('empty', 'gol'),
  inHa: L('In Home Assistant', 'În Home Assistant'),
  on: L('On (checked)', 'Activat (bifat)'), off: L('Off (unchecked)', 'Dezactivat (nebifat)'),
  entHint: L('Entity IDs, separated by commas. Optional here: you pick them in the real form; typing them makes the summary complete.', 'ID-uri de entități, separate prin virgulă. Aici e opțional: le alegi în formularul real; dacă le scrii, rezumatul iese complet.'),
  unitNote: L('This guide enters numbers in °C. If you chose °F, the summary converts them for you.', 'Ghidul introduce numerele în °C. Dacă ai ales °F, rezumatul le convertește pentru tine.'),
  restart: L('Start over', 'Ia-o de la capăt'), changeLang: L('Language', 'Limba'),
  roomLabel: L('Room', 'Camera'), wholeLabel: L('Whole house zone', 'Zona „Toată casa”'),
  sumTitle: L('Your configuration', 'Configurația ta'),
  sumSub: L('Everything you chose, grouped exactly like the forms in Home Assistant. Follow the groups from top to bottom.', 'Tot ce ai ales, grupat exact ca formularele din Home Assistant. Urmează grupurile de sus în jos.'),
  installTitle: L('Install first', 'Instalează mai întâi'),
  install: [
    L('HACS → ⋮ → Custom repositories → add https://github.com/sandreialexandru/Smart-Heating-Control as type Integration.', 'HACS → ⋮ → Custom repositories → adaugă https://github.com/sandreialexandru/Smart-Heating-Control ca tip Integration.'),
    L('Install “Smart Heating Control” and restart Home Assistant (version 2026.6.0 or newer).', 'Instalează „Smart Heating Control” și repornește Home Assistant (versiunea 2026.6.0 sau mai nouă).'),
    L('Settings → Devices & services → Add integration → Smart Heating Control, then follow the groups below.', 'Setări → Dispozitive și servicii → Adaugă integrare → Smart Heating Control, apoi urmează grupurile de mai jos.')
  ],
  checksTitle: L('Things to check', 'Verifică acestea'),
  allGood: L('No problems found in your choices.', 'Nu am găsit probleme în alegerile tale.'),
  showAll: L('Show default values too', 'Arată și valorile implicite'),
  copy: L('Copy as text', 'Copiază ca text'), copied: L('Copied', 'Copiat'),
  nothingSet: L('Everything in this group stays on its default.', 'Tot ce e în acest grup rămâne pe valorile implicite.'),
  unitHouse: L('House unit', 'Unitatea casei'),
  locked: L('Not available yet', 'Indisponibil deocamdată'),
  cardTip: L('After that, add the card: Add card → Smart Heating Control. The integration registers it by itself.', 'Apoi adaugă cardul: Adaugă card → Smart Heating Control. Integrarea îl înregistrează singură.')
};

const P_ADD = L('Settings → Devices & services → Add integration → Smart Heating Control', 'Setări → Dispozitive și servicii → Adaugă integrare → Smart Heating Control');
const P_OPT = (en, ro) => L('Integration page → Configure → ' + en, 'Pagina integrării → Configurează → ' + ro);
const P_ROOM = L('Integration page → Add room (or ⋮ → Reconfigure room)', 'Pagina integrării → Adaugă cameră (sau ⋮ → Reconfigurează camera)');

const PRESET_DEFS = [
  ['home', L('someone is home, daytime', 'cineva e acasă, ziua'), 21],
  ['sleep', L('night, someone home', 'noaptea, cineva acasă'), 18],
  ['eco', L('nobody home, someone nearby', 'nimeni acasă, cineva aproape'), 17],
  ['away', L('everybody far, or vacation', 'toți departe sau vacanță'), 12],
  ['comfort', L('no automatic role, use it in the schedule', 'fără rol automat, îl folosești în program'), 22],
  ['activity', L('no automatic role, use it in the schedule', 'fără rol automat, îl folosești în program'), 20]
];

/* helpers to build common fields */
const ents = (k, l, d, ph, extra) => Object.assign({ k, t: 'ents', l, d, ph }, extra || {});
const num = (k, l, d, def, min, max, step, u, extra) => Object.assign({ k, t: 'num', l, d, def, min, max, step, u }, extra || {});
const rad = (k, l, d, opts, def, extra) => Object.assign({ k, t: 'radio', l, d, opts, def }, extra || {});
const bool = (k, l, d, def, on, off, extra) => Object.assign({ k, t: 'bool', l, d, def, on, off }, extra || {});
const O = (v, l, m, e, x) => ({ v, l, m, e, x });

const hasOutdoor = c => !!(String(c.o('outdoor_sensor') || '').trim() || String(c.o('weather') || '').trim());
const hasWeather = c => !!String(c.o('weather') || '').trim();
const needOutdoor = L('Needs an outdoor temperature. Fill in the outdoor sensor or the weather entity above, on this same page.', 'Are nevoie de temperatura exterioară. Completează mai sus senzorul exterior sau entitatea meteo, în aceeași pagină.');
const needWeather = L('Needs a weather entity (and, for the forecast, the outdoor cutoff turned on). Fill in the weather entity above.', 'Are nevoie de o entitate meteo (iar pentru prognoză, pragul exterior pornit). Completează mai sus entitatea meteo.');

/* fields reused in house + room "control" steps */
const hystOnOff = num('hysteresis', L('Hysteresis', 'Histerezis'),
  L('A dead band around the target. Heating starts below target − hysteresis and stops above target + hysteresis, so the relay does not switch every minute. Smaller is more precise but switches more often.', 'O bandă moartă în jurul țintei. Încălzirea pornește sub țintă − histerezis și se oprește peste țintă + histerezis, ca releul să nu comute la fiecare minut. Mai mic înseamnă precizie mai mare, dar comutări mai dese.'),
  0.3, 0.1, 3, 0.1, '°C', {
    temp: 'delta',
    live: (v, c) => L(`With a target of 21 °C: starts below ${(21 - v).toFixed(1)} °C, stops above ${(21 + v).toFixed(1)} °C. Inside that band the relay keeps its state.`, `Cu ținta de 21 °C: pornește sub ${(21 - v).toFixed(1)} °C, se oprește peste ${(21 + v).toFixed(1)} °C. În interiorul benzii releul își păstrează starea.`)
  });
const minOn = num('min_on_minutes', L('Minimum on time', 'Timp minim pornit'),
  L('The shortest time the relay stays on after switching on. Protects boilers and compressors. Counted from the last switch, also one made by hand. 0 (default) = no wait; set a few minutes for a boiler without its own anti-cycling.', 'Cel mai scurt timp cât rămâne releul pornit. Protejează cazanul sau compresorul. Se numără de la ultima comutare, inclusiv una făcută manual. 0 (implicit) = fără așteptare; câteva minute pentru o centrală fără protecție proprie la cicluri scurte.'),
  0, 0, 60, 1, 'min', { ex: L('Relay of a boiler without its own anti-cycling: a few minutes. Electric heater on a smart plug: 0.', 'Releu de centrală fără protecție proprie: câteva minute. Radiator electric pe priză inteligentă: 0.') });
const minOff = num('min_off_minutes', L('Minimum off time', 'Timp minim oprit'),
  L('The shortest pause between two starts. 0 (default) = no wait. Together with the minimum on time it limits how many cycles per hour the boiler can make.', 'Cea mai scurtă pauză între două porniri. 0 (implicit) = fără așteptare. Împreună cu timpul minim pornit limitează numărul de cicluri pe oră ale centralei.'),
  0, 0, 60, 1, 'min');
const toleranceF = num('learn_tolerance', L('Thermostat tolerance', 'Toleranța termostatului'),
  L('How far below the target your thermostat lets the room fall before it starts heating (its own tolerance). The integration learns heating times only from rises that start at least this far below the target. If you are not sure, keep 0.', 'Cât sub țintă lasă termostatul camera să scadă înainte să încălzească (toleranța lui). Integrarea învață timpii de încălzire doar din creșteri care pornesc cel puțin atât sub țintă. Dacă nu ești sigur, lasă 0.'),
  0, 0, 2, 0.1, '°C', { temp: 'delta', ex: L('Target 22 °C, tolerance 0.5 °C: an episode can start at 21.5 °C or lower.', 'Țintă 22 °C, toleranță 0,5 °C: un episod poate începe la 21,5 °C sau mai jos.') });
const reportsQ = rad('reports', L('Does your thermostat report when it is heating?', 'Termostatul tău raportează când încălzește?'),
  L('Open Developer tools → States, find the thermostat and look for the attribute hvac_action (heating / idle). This is only a question for you; it decides whether the form asks for a hysteresis.', 'Deschide Instrumente dezvoltator → Stări, caută termostatul și uită-te la atributul hvac_action (heating / idle). E doar o întrebare pentru tine; hotărăște dacă formularul îți cere un histerezis.'),

    if (f.t === 'ents') h += `<p class="hint">${esc(t(T.entHint))}</p>`;
  }
  if (f.ex && !lock) h += `<p class="fex"><b>${esc(t(T.example))}</b>${esc(t(f.ex))}</p>`;
  return h + `</section>`;
}

function render() {
  const keepY = window.scrollY;
  const keep = document.activeElement && document.activeElement.id;
  if (S.step === 'lang' || !S.lang) { renderLang(); return; }
  const fl = flow(); let i = fl.findIndex(x => x.id === S.step);
  if (i < 0) { i = 0; S.step = fl[0].id; }
  const it = fl[i];
  const head = `<header class="top"><div class="brand"><span class="mark" aria-hidden="true"></span><strong>${esc(t(T.title))}</strong></div><div class="tools"><button class="ghost" data-act="lang">${esc(S.lang === 'en' ? 'Română' : 'English')}</button><button class="ghost" data-act="restart">${esc(t(T.restart))}</button></div></header>`;
  let body = '';
  if (it.s.summary) body = summaryHTML(fl);
  else {
    const c = ctx(it.ri, it.s.sec);
    const fields = it.s.fields.filter(f => !f.show || f.show(c)).map(f => fieldHTML(f, c, it)).join('');
    body = `<article class="card"><div class="eyebrow">${roomChip(it)}<span class="chip where" title="${esc(t(T.inHa))}">${esc(t(T.inHa))}: ${esc(t(it.s.where))}</span></div><h1>${esc(t(it.s.title))}</h1><p class="intro">${esc(t(it.s.intro))}</p>${fields}</article>`;
  }
  const last = fl[i + 1] && fl[i + 1].s.summary;
  const nav = `<footer class="nav"><span class="count">${esc(t(T.step))} ${i + 1} ${esc(t(T.of))} ${fl.length}</span><div class="btns">${i > 0 ? `<button class="btn" data-act="back">${esc(t(T.back))}</button>` : ''}${it.s.summary ? '' : `<button class="btn primary" data-act="next">${esc(t(last ? T.finish : T.next))}</button>`}</div></footer>`;
  $app.innerHTML = head + progressHTML(fl, i) + `<main>${body}</main>` + nav;
  if (keep) { const el = document.getElementById(keep); if (el) { try { el.focus({ preventScroll: true }); } catch (e) { /* ignore */ } } }
  window.scrollTo(0, keepY);
}

function renderLang() {
  $app.innerHTML = `<section class="lang"><span class="mark big" aria-hidden="true"></span><h1>Smart Heating Configurator</h1><p>${esc(T.pickLangSub.en)}</p><p>${esc(T.pickLangSub.ro)}</p><div class="langbtns"><button class="btn primary big" data-act="pick" data-lang="en"><b>English</b><small>Configure step by step</small></button><button class="btn primary big" data-act="pick" data-lang="ro"><b>Română</b><small>Configurezi pas cu pas</small></button></div></section>`;
}

/* ----- summary ----- */
function fmtValue(f, v, c) {
  const unit = c.h('temperature_unit');
  if (f.t === 'radio') { const o = f.opts.find(x => String(x.v) === String(v)); return o ? t(o.l) : String(v); }
  if (f.t === 'bool') return t(v ? T.on : T.off);
  if (f.t === 'num') {
    if (v == null || v === '') return t(T.emptyIs);
    const x = f.temp ? conv(v, f.temp, unit) : v; return x + (unitText(f, c) ? ' ' + unitText(f, c) : '');
  }
  const s = String(v || '').trim(); return s || '—';
}
const norm = v => (v == null ? '' : (typeof v === 'string' ? v.trim() : v));
function groups(fl) {
  const out = [];
  fl.forEach(it => {
    if (it.s.summary) return;
    const c = ctx(it.ri, it.s.sec); const rows = [];
    it.s.fields.forEach(f => {
      if (f.helper || f.k === 'more') return;
      if (f.show && !f.show(c)) return;
      if (f.need && f.need(c)) return;
      const v = c.val(f.k); const d = defOf(effScope(c.curScope, c.ri, f.k), f.k, c);
      const changed = JSON.stringify(norm(v)) !== JSON.stringify(norm(d));
      rows.push({ f, label: t(f.l), value: fmtValue(f, v, c), changed, mono: f.t === 'ents' || f.t === 'area' || f.t === 'time' || f.t === 'text' && f.k !== 'name' });
    });
    if (it.s.more) return;
    out.push({ it, rows, title: t(it.s.title), where: t(it.s.where), room: it.ri == null ? '' : (S.rooms[it.ri].whole ? t(T.wholeLabel) : (String(ctx(it.ri, 'rooms').r('name') || '').trim() || t(T.roomLabel) + ' ' + (it.ri + 1))) });
  });
  return out;
}

function issues(fl) {
  const out = []; const c0 = ctx(0, 'house');
  const rooms = S.rooms.slice(0, fl.filter(x => x.s.more).length || 1).map((r, i) => ({ r, i, c: ctx(i, 'rooms') }));
  const boiler = hasTxt(c0.o('boiler_entity')); const bcase = c0.o('boiler_case');
  const anyTrv = rooms.some(x => (x.c.src() === 'climate' && x.c.cmd() !== 'hvac_mode'));
  const anyOptimal = rooms.some(x => x.c.r('optimal_start') || x.c.r('optimal_stop'));
  if (!hasTxt(c0.h('name'))) out.push(['err', L('The house has no name.', 'Casa nu are nume.')]);
  if (anyTrv && !boiler && bcase !== 'trv_ext') out.push(['warn', L('You have TRV rooms but no Heat source. If nothing starts the boiler, the radiators stay cold. Pick the boiler or its relay under Heat source and heat demand, or choose the option for a boiler started outside Home Assistant.', 'Ai camere cu TRV dar nicio Sursă de căldură. Dacă nimic nu pornește centrala, caloriferele rămân reci. Alege centrala sau releul ei la Sursa de căldură, sau bifează varianta cu centrală pornită din afara Home Assistant.')]);
  if (anyTrv && !boiler && bcase === 'trv_ext' && anyOptimal) out.push(['warn', L('TRVs with a boiler started outside Home Assistant make the learning unreliable. Optimal start and stop are not recommended; turn them off or bring the boiler into Home Assistant.', 'TRV-urile cu o centrală pornită din afara Home Assistant fac învățarea nefiabilă. Pornirea și oprirea anticipată nu sunt recomandate; oprește-le sau adu centrala în Home Assistant.')]);
  if ((c0.h('source') === 'generic_thermostat' || c0.h('source') === 'switch') && boiler) out.push(['warn', L('A Heat source is set although the whole house is heated by Generic Thermostat or a relay. Normally leave it empty, and never pick the relay used by a Generic Thermostat.', 'Ai setat o Sursă de căldură deși toată casa e încălzită de Generic Thermostat sau releu. În mod normal las-o goală și nu alege niciodată releul folosit de un Generic Thermostat.')]);
  const needSens = (c, hs) => !hasTxt(c.r('temperature_sensors'));
  if (c0.h('source') === 'switch' || (c0.h('source') === 'climate' && c0.h('command_mode') === 'hvac_mode')) { if (c0.h('source') === 'switch' && !hasTxt(c0.h('temperature_sensors'))) out.push(['err', L('Whole house: a relay needs at least one room temperature sensor.', 'Toată casa: un releu cere cel puțin un senzor de temperatură din cameră.')]); }
  if (c0.h('source') !== 'none' && c0.h('source') !== 'switch' && !hasTxt(c0.h('climates'))) out.push(['info', L('Whole house: remember to pick at least one thermostat in the real form.', 'Toată casa: nu uita să alegi cel puțin un termostat în formularul real.')]);
  if (c0.h('source') === 'climate' && c0.h('trv_boost') && c0.h('command_mode') !== 'temperature') out.push(['err', L('Whole house: the TRV boost works only with the Temperature command.', 'Toată casa: forțarea TRV merge doar cu comanda Temperatură.')]);
  rooms.forEach(({ r, i, c }) => {
    const nm = r.whole ? t(T.wholeLabel) : (String(c.r('name') || '').trim() || t(T.roomLabel) + ' ' + (i + 1));
    if (!r.whole && c.src() === 'switch' && !hasTxt(c.r('temperature_sensors'))) out.push(['err', L(`${nm}: relays need a room temperature sensor.`, `${nm}: releele cer un senzor de temperatură din cameră.`)]);
    if (!r.whole && c.src() === 'climate' && c.cmd() === 'hvac_mode' && !hasTxt(c.r('temperature_sensors'))) out.push(['info', L(`${nm}: no room sensor is set, so the thermostat’s own temperature is used. That works, but a sensor in the room is more accurate.`, `${nm}: nu ai setat senzor în cameră, deci se folosește temperatura proprie a termostatului. Funcționează, dar un senzor în cameră e mai precis.`)]);
    if (!r.whole && c.src() === 'climate' && c.r('trv_boost') && c.cmd() !== 'temperature') out.push(['err', L(`${nm}: the TRV boost works only with the Temperature command.`, `${nm}: forțarea TRV merge doar cu comanda Temperatură.`)]);
    if (c.src() === 'climate' && c.cmd() === 'temperature' && c.r('trv_boost') && !hasTxt(c.r('temperature_sensors'))) out.push(['err', L(`${nm}: the TRV boost needs a room temperature sensor.`, `${nm}: forțarea TRV cere un senzor de temperatură din cameră.`)]);
    if (c.r('schedule_source') === 'helper' && !hasTxt(c.r('schedule_helper'))) out.push(['err', L(`${nm}: pick the Schedule helper entity.`, `${nm}: alege entitatea helper Program.`)]);
    if (!r.whole && !hasTxt(c.r('climates')) && !hasTxt(c.r('switches'))) out.push(['info', L(`${nm}: pick at least one device in the real form.`, `${nm}: alege cel puțin un dispozitiv în formularul real.`)]);
    if (c.r('optimal_start') && Number(c0.o('boiler_min_rooms')) > 1) out.push(['info', L(`${nm}: with Rooms needed above 1, an optimal start waits for enough rooms, so it may reach the target later.`, `${nm}: cu Camere necesare peste 1, o pornire anticipată așteaptă destule camere, deci poate ajunge mai târziu la țintă.`)]);
    if (c.r('schedule_source') !== 'helper' && c.r('window_action') === 'off') out.push(['info', L(`${nm}: window action “Turn off” gives no frost protection from heating while the window is open.`, `${nm}: acțiunea „Oprire” la fereastră nu protejează de îngheț prin încălzire cât fereastra e deschisă.`)]);
  });
  if (Number(c0.o('boiler_min_rooms')) > rooms.length && boiler) out.push(['warn', L('Rooms needed to start the heat source is higher than the number of rooms you added. The form allows at most the number of rooms.', 'Camerele necesare pentru pornirea sursei sunt mai multe decât camerele adăugate. Formularul permite cel mult numărul de camere.')]);
  if (c0.o('cutoff_enabled') && c0.o('season_mode') === 'always') out.push(['info', L('Cutoff on with season “Always”: the warm-outside cutoff stops the heating in warm weather, but in deep summer you may still prefer mode Summer or an automatic season.', 'Prag pornit cu sezon „Mereu”: pragul oprește încălzirea pe vreme caldă, dar vara ai putea prefera modul Vară sau un sezon automat.')]);
  return out;
}

const visRows = g => g.rows.filter(r => S.showDef || r.changed || r.f.req);
function summaryHTML(fl) {
  const gs = groups(fl).filter(g => visRows(g).length); const is = issues(fl);
  let h = `<article class="card sum"><div class="eyebrow"><span class="chip">${esc(t(T.secDone))}</span></div><h1>${esc(t(T.sumTitle))}</h1><p class="intro">${esc(t(T.sumSub))}</p>`;
  h += `<section class="box"><h2>${esc(t(T.installTitle))}</h2><ol>` + T.install.map(x => `<li>${esc(t(x))}</li>`).join('') + `</ol></section>`;
  h += `<section class="box checks"><h2>${esc(t(T.checksTitle))}</h2>` + (is.length ? `<ul>` + is.map(x => `<li class="${x[0]}"><span class="dot"></span>${esc(t(x[1]))}</li>`).join('') + `</ul>` : `<p class="ok">${esc(t(T.allGood))}</p>`) + `</section>`;
  h += `<div class="sumtools"><label class="chk"><input type="checkbox" id="showdef"${S.showDef ? ' checked' : ''}> ${esc(t(T.showAll))}</label><button class="btn" data-act="copy" id="copybtn">${esc(t(T.copy))}</button></div>`;
  let lastKey = '';
  gs.forEach(g => {
    const key = g.where + '|' + g.room;
    if (key !== lastKey) { h += `<div class="path"><span>${esc(t(T.inHa))}</span>${esc(g.where)}${g.room ? ` · <b>${esc(g.room)}</b>` : ''}</div>`; lastKey = key; }
    h += `<section class="grp"><h3>${esc(g.title)}</h3><dl>` + visRows(g).map(r => `<div class="row${r.changed ? ' chg' : ''}"><dt>${esc(r.label)}</dt><dd class="${r.mono ? 'mono' : ''}">${r.f.t === 'area' ? `<pre>${esc(r.value)}</pre>` : esc(r.value)}</dd></div>`).join('') + `</dl></section>`;
  });
  if (!gs.length) h += `<p class="none">${esc(t(T.nothingSet))}</p>`;
  h += `<p class="fnote">${esc(t(T.cardTip))}</p></article>`;
  return h;
}
function summaryText() {
  const gs = groups(flow()).filter(g => visRows(g).length); let txt = t(T.title) + '\n\n';
  txt += t(T.installTitle) + ':\n' + T.install.map((x, i) => (i + 1) + '. ' + t(x)).join('\n') + '\n';
  let lastKey = '';
  gs.forEach(g => {
    const key = g.where + '|' + g.room;
    if (key !== lastKey) { txt += '\n== ' + g.where + (g.room ? ' [' + g.room + ']' : '') + ' ==\n'; lastKey = key; }
    txt += '-- ' + g.title + '\n';
    visRows(g).forEach(r => { txt += '   ' + r.label + ': ' + r.value.replace(/\n/g, ' / ') + '\n'; });
  });
  return txt;
}

/* ----- navigation ----- */
function go(dir) {
  const fl = flow(); const i = fl.findIndex(x => x.id === S.step); const cur = fl[i];
  if (dir > 0) {
    if (cur.s.more && S.rooms[cur.ri].more === 'yes' && S.rooms.length <= cur.ri + 1) S.rooms.push({});
    const f2 = flow(); const j = f2.findIndex(x => x.id === cur.id);
    S.step = f2[Math.min(j + 1, f2.length - 1)].id;
  } else S.step = fl[Math.max(i - 1, 0)].id;
  save(); render(); window.scrollTo({ top: 0 });
}

/* ----- events ----- */
function parseVal(el) {
  const sc = el.dataset.sc; const k = el.dataset.k;
  return { f: FIELDS[sc + ':' + k] || FIELDS['house:' + k], k, sc, ri: +el.dataset.ri };
}
function afterChange(forceNow) {
  const run = () => { if (sig() !== lastSig) { lastSig = sig(); render(); } };
  if (forceNow) { lastSig = sig(); render(); } else setTimeout(() => { const keep = document.activeElement && document.activeElement.id; run(); if (keep) { const el = document.getElementById(keep); if (el && document.activeElement !== el) { try { el.focus({ preventScroll: true }); } catch (e) { /* ignore */ } } } }, 0);
}
let lastSig = '';

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'pick') { S.lang = b.dataset.lang; S.step = flow()[0].id; save(); render(); }
  else if (a === 'lang') { S.lang = S.lang === 'en' ? 'ro' : 'en'; save(); render(); }
  else if (a === 'restart') { S = { lang: S.lang, step: 'lang', a: { house: {}, opts: {} }, rooms: [{}], showDef: false }; S.step = flow()[0].id; save(); render(); window.scrollTo({ top: 0 }); }
  else if (a === 'next') go(1);
  else if (a === 'back') go(-1);
  else if (a === 'copy') {
    const txt = summaryText(); const btn = document.getElementById('copybtn');
    const done = () => { btn.textContent = t(T.copied); setTimeout(() => { btn.textContent = t(T.copy); }, 1600); };
    const fb = () => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (er) { /* ignore */ } ta.remove(); };
    try { navigator.clipboard.writeText(txt).then(done, fb); } catch (er) { fb(); }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'showdef') { S.showDef = el.checked; save(); render(); return; }
  if (!el.dataset || !el.dataset.k) return;
  const { f, k, sc, ri } = parseVal(el); if (!f) return;
  if (el.type === 'radio') {
    setv(sc, ri, k, f.t === 'bool' ? el.value === '1' : el.value);
    lastSig = sig(); render();
    return;
  }
  if (f.t === 'num') {
    if (el.value === '') { if (f.opt) setv(sc, ri, k, null); else { delete storeOf(sc, ri, k)[k]; save(); } } else setv(sc, ri, k, Math.round(parseFloat(el.value) * 10000) / 10000);
  } else setv(sc, ri, k, el.value);
  afterChange(false);
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.k || el.type === 'radio') return;
  const { f, k, sc, ri } = parseVal(el); if (!f) return;
  if (f.t === 'num') {
    const row = el.closest('.numrow'); const val = el.value === '' ? null : parseFloat(el.value);
    row.querySelectorAll('input').forEach(o => { if (o !== el && val != null) o.value = el.value; });
    if (val == null) { if (f.opt) setv(sc, ri, k, null); } else setv(sc, ri, k, Math.round(val * 10000) / 10000);
    const lv = row.parentElement.querySelector('.live');
    if (lv && f.live) { const it = flow().find(x => x.id === S.step); if (val != null && it) { lv.textContent = t(f.live(val, ctx(it.ri, it.s.sec))); lv.hidden = false; } else lv.hidden = true; }
  } else { setv(sc, ri, k, el.value); }
});

if (S.lang && S.step === 'lang') S.step = flow()[0].id;
lastSig = S.lang ? sig() : '';
render();
</script>

</body></html>
